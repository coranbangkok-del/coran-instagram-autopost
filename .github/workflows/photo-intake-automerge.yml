name: Photo intake auto-merge

# 写真の月次取り込み（Mac の定期タスク purple-monthly-photo-intake）が作る PR を、
# 変更が「既存カテゴリへの画像の追加＋manifest」だけで、セルフテストが通るときに限って自動でマージする（社長決定 2026-09-22）。
#
# 守り（gray r126 条件4 で固くした形）:
#   - 対象はブランチ接頭辞 routine/photo-intake- だけ。公開 repo なので fork からの PR は必ず除外。
#   - pull_request_target で動かす＝ワークフロー定義は main の版。コードも main から checkout し、
#     PR のブランチにあるコード（src/・tools/・ワークフロー）は一切実行しない。
#     PR から取り出すのは、門番（main の tools/intake_guard.py）が通した画像と manifest のファイルだけ。
#   - manifest.json は main の tools/build_manifest.py で作り直した結果と一致すること。
#   - セルフテストも main のコードで、PR の画像を載せた状態で走らせる。
#   - マージは --match-head-commit で「検査した commit」だけを対象にする（検査後の追い push は弾かれる）。
#   - routine/photo-intake- 以外のブランチ（人の PR・ほかのルーティン）はここでは絶対にマージしない。
#   - シークレットは GITHUB_TOKEN 以外使わない。
#   - 限界: push イベントの実行はブランチ側のワークフロー定義で動く。ただしブランチに push できる人は main にも
#     直接 push できる（ブランチ保護なし）ので、これは「意図しない混入の自動マージを防ぐ門番」であり、
#     書き込み権を持つ人の悪意を防ぐものではない。
#
# 起動:
#   push（routine/photo-intake-** への push）… PR が無ければ作ってからマージする。
#       PR の自動作成が repo 設定で禁止されている場合は、作成 URL を出して止まる → 人が PR を開けば下で自動マージ。
#       既に PR がある場合は pull_request_target 側に任せる（二重マージを避ける）。
#   pull_request_target（人が PR を開いた／更新した）… 検査してマージする。
on:
  push:
    branches: ["routine/photo-intake-**"]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: photo-intake-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  intake:
    name: 写真取り込み PR の検査と自動マージ
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'routine/photo-intake-')) ||
      (github.event_name == 'pull_request_target' &&
       startsWith(github.head_ref, 'routine/photo-intake-') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: main のコードを checkout（PR のコードは使わない）
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PR の commit を取得（作業ツリーには出さない）
        run: |
          set -euo pipefail
          git fetch -q origin "refs/heads/${BRANCH}"
          got="$(git rev-parse FETCH_HEAD)"
          if [ "$got" != "$HEAD_SHA" ]; then
            echo "::notice::ブランチが検査対象より先に進んでいます（$got）。新しい実行に任せて終了します。"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: 変更ファイルの門番（main の tools/intake_guard.py）
        if: env.SKIP != '1'
        run: python tools/intake_guard.py origin/main "$HEAD_SHA"

      - name: 門番が通したファイルだけを PR から取り出す
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main "$HEAD_SHA")"
          git diff --name-only --no-renames --diff-filter=AM "$base" "$HEAD_SHA" -z \
            | xargs -0 -r git checkout "$HEAD_SHA" --
          git status --short

      - name: manifest が main の build_manifest.py の出力と一致する
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          git show "$HEAD_SHA:images/manifest.json" > "$RUNNER_TEMP/pr-manifest.json"
          python tools/build_manifest.py
          diff -u "$RUNNER_TEMP/pr-manifest.json" images/manifest.json

      - name: セルフテスト（main のコード × PR の画像・ネットワーク不要）
        if: env.SKIP != '1'
        run: |
          pip install -r requirements.txt
          python tools/selftest_brand.py
          python tools/selftest_intake.py

      - name: PR を用意してマージ
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            PR="${{ github.event.pull_request.number }}"
          else
            PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
            if [ -n "$PR" ]; then
              echo "PR #$PR が既にあるので、pull_request_target 側の実行でマージします。"
              exit 0
            fi
            if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
                 --title "写真の月次取り込み（${BRANCH#routine/photo-intake-}）" \
                 --body "Mac の定期タスク purple-monthly-photo-intake が作った写真取り込みです。変更ファイルの門番（画像の追加＋manifest のみ）とセルフテストを通ったので自動マージします。"; then
              echo "::warning::PR を自動で作れませんでした（repo 設定『Allow GitHub Actions to create and approve pull requests』が無効の可能性）。次の URL から PR を開けば、自動でマージされます。"
              echo "https://github.com/${GITHUB_REPOSITORY}/pull/new/${BRANCH}" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          fi
          echo "PR #$PR をマージ（検査した commit ${HEAD_SHA} に限る）"
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"
