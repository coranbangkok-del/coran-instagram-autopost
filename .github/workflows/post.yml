name: CORAN Instagram Auto-Post

# 週2回・曜日と時刻を分散（機械的パターン回避）
#   火 19:00 ICT (= 12:00 UTC)
#   金 11:00 ICT (= 04:00 UTC)
on:
  schedule:
    - cron: "0 12 * * 2"
    - cron: "0 4 * * 5"
  workflow_dispatch: {}   # 手動実行も可能

permissions:
  contents: write          # state/ をコミットして戻すため

# 承認待ちの候補は常に最新の1件だけにする。
#   次の候補が作られた時点で、承認されなかった古い実行は自動で取り消す
#   （放置すると30日後に「失敗」になり、候補ファイルは7日で消えるので承認しても投稿できない）。
concurrency:
  group: ig-auto-post
  cancel-in-progress: true

# ▼ 2つの経路（リポジトリ変数 CALENDAR_MODE で切り替え・既定は従来どおり）
#   CALENDAR_MODE が "on" 以外（未設定を含む）: prepare → production 承認（投稿ごと）→ publish  … 従来
#   CALENDAR_MODE == "on"                   : publish-calendar だけが動く                     … 社長決定 2026-09-22 S-2
#       main にある承認済み calendar/YYYY-MM.json（月1回の PR マージ＝包括承認）に載っている今日の1件だけを、
#       投稿ごとの承認なしで公開する。カレンダーが無い・今日の分が無い・中身が記録と違う → 投稿しない（fail-closed）。
#   切り替えは Settings → Secrets and variables → Actions → Variables に CALENDAR_MODE=on（社長の設定操作）。
jobs:
  prepare:
    name: 投稿候補を作成
    if: vars.CALENDAR_MODE != 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Prepare candidate
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
        run: python src/main.py prepare
      # 生成したブランド画像を main へ戻す。Instagram は公開URLから画像を取得するため、
      # 承認より前に raw URL が引ける状態にしておく必要がある（承認画面のプレビューも同じURL）。
      # 副次効果: 承認されなくても毎回コミットが入るので「60日無活動で cron 無効化」に戻らない。
      - name: Commit generated image
        run: |
          git config user.name "coran-autopost-bot"
          git config user.email "bot@coran.local"
          git add -A images/generated
          if git diff --cached --quiet; then
            echo "生成画像に変更なし（BRAND_IMAGE=off か生成失敗）"
          else
            git commit -m "chore: brand image for next post [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: candidate.json
          retention-days: 7

  publish:
    name: 承認後に投稿
    needs: prepare
    runs-on: ubuntu-latest
    # ▼ 承認ゲート：production 環境に「必須レビュアー＝あなた」を設定する。
    #   承認するまでこのジョブは止まり、却下すれば投稿されない。
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate
      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: python src/main.py publish
      - name: Commit updated state
        run: |
          git config user.name "coran-autopost-bot"
          git config user.email "bot@coran.local"
          git add state/
          git commit -m "chore: update post state [skip ci]" || echo "no changes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  publish-calendar:
    name: 承認済みカレンダーから投稿（CALENDAR_MODE=on）
    # main 以外（手動実行でブランチを選んだ場合など）では動かさない＝未承認のカレンダーを読ませない
    if: vars.CALENDAR_MODE == 'on' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ▼ 投稿ごとの承認ゲート（environment: production）は付けない。承認はカレンダー PR のマージで済んでいる。
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish today's approved post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: python src/main.py publish-calendar
      - name: Commit updated state
        run: |
          git config user.name "coran-autopost-bot"
          git config user.email "bot@coran.local"
          git add state/
          if git diff --cached --quiet; then
            echo "state に変更なし（今日は投稿日でない）"
          else
            git commit -m "chore: update post state (calendar) [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
