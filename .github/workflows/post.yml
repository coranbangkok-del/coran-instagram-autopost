name: CORAN Instagram Auto-Post

# 週2回・曜日と時刻を分散（機械的パターン回避）
#   火 19:00 ICT (= 12:00 UTC)
#   金 11:00 ICT (= 04:00 UTC)
#
# 2026-09-22〜 スマホ承認（社長が Claude の非公開ページで確認・本文修正・承認）。
#   候補（CORAN Frame の画像＋本文の下書き）は投稿の24時間前にパープルのルーティンが作り、
#   承認の締切は投稿の2時間前。社長の端末の鍵で署名された承認だけが
#   ig-queue ブランチの queue/<slot>/approval.json に置かれる。
#   ここでは署名・画像のハッシュ・本文のハッシュ・締切・価格語を確かめ、全部通ったときだけ投稿する。
#   承認が無い回は投稿しない（fail-closed・失敗扱いにはしない）。
#   公開鍵は Actions 変数 IG_APPROVER_PUBKEYS（未設定なら投稿しない）。
on:
  schedule:
    - cron: "0 12 * * 2"
    - cron: "0 4 * * 5"
  workflow_dispatch: {}   # 手動実行も可能（同じ検証を通る。承認が無ければ投稿しない）

permissions:
  contents: write          # state/ をコミットして戻すため

concurrency:
  group: ig-auto-post
  cancel-in-progress: false   # 投稿の途中で取り消さない（二重投稿も posted_slots で防ぐ）

jobs:
  check:
    name: 社長の承認を確かめる
    runs-on: ubuntu-latest
    outputs:
      has_approval: ${{ steps.verify.outputs.has_approval }}
      queue_sha: ${{ steps.queue.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch ig-queue (approved images + signed approvals)
        id: queue
        run: |
          if git ls-remote --exit-code --heads origin ig-queue >/dev/null; then
            git fetch --depth=1 origin ig-queue
            sha="$(git rev-parse FETCH_HEAD)"
            git worktree add --detach _queue "$sha"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "ig-queue ブランチが無い＝承認なし"
            mkdir -p _queue
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify signed approval (no posting here)
        id: verify
        env:
          IG_USER_ID: "check-only"
          IG_ACCESS_TOKEN: "check-only"
          IMAGE_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/images"
          IG_APPROVER_PUBKEYS: ${{ vars.IG_APPROVER_PUBKEYS }}
        run: python src/main.py publish-approved --queue-root _queue --queue-sha "${{ steps.queue.outputs.sha }}" --dry-run

  publish:
    name: 承認済みの1件を投稿
    needs: check
    if: needs.check.outputs.has_approval == 'true'
    runs-on: ubuntu-latest
    # production 環境の必須レビュアー設定が残っている間は、ここで GitHub の Approve も要る（二重の関門）。
    # 社長が必須レビュアーを外すと Claude のページの承認だけで投稿される（決裁 GO-2）。
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the same ig-queue commit that was checked
        run: |
          git fetch --depth=1 origin "${{ needs.check.outputs.queue_sha }}"
          git worktree add --detach _queue "${{ needs.check.outputs.queue_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify again and publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          IG_APPROVER_PUBKEYS: ${{ vars.IG_APPROVER_PUBKEYS }}
        run: python src/main.py publish-approved --queue-root _queue --queue-sha "${{ needs.check.outputs.queue_sha }}"
      - name: Commit updated state
        run: |
          git config user.name "coran-autopost-bot"
          git config user.email "bot@coran.local"
          git add state/
          git commit -m "chore: update post state [skip ci]" || echo "no changes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
