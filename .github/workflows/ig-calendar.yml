name: CORAN IG Monthly Calendar

# 月次カレンダー承認（社長決定 2026-09-22・S-2）
#   毎月1日に「翌月分」の calendar/YYYY-MM.json と画像（images/calendar/YYYY-MM/）を作り、
#   ブランチ routine/ig-calendar-YYYY-MM に push して PR を開く。
#   ★ この PR は自動マージしない。社長がマージする＝その月の IG 通常投稿の包括承認。
#   Instagram・LINE には何も送らない（本文生成に Claude API、声の取得に Places API を使うことはある）。
on:
  schedule:
    - cron: "0 6 1 * *"   # 毎月1日 13:00 ICT（写真の月次取り込みの後）
  workflow_dispatch:
    inputs:
      month:
        description: "作る月 YYYY-MM（空欄＝翌月）"
        required: false
        default: ""

permissions:
  contents: write         # routine/ig-calendar-* ブランチの push
  pull-requests: write    # PR の作成

concurrency:
  group: ig-calendar
  cancel-in-progress: false

jobs:
  build:
    name: 翌月のカレンダーを作って PR を開く
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Decide month
        id: month
        env:
          INPUT_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import os, re, sys
          sys.path.insert(0, "src")
          import ig_calendar
          m = (os.environ.get("INPUT_MONTH") or "").strip()
          if not m:
              m = ig_calendar.next_month(ig_calendar.today_bkk())
          if not re.fullmatch(r"\d{4}-(0[1-9]|1[0-2])", m):
              sys.exit(f"月の形式が不正: {m!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"month={m}\n")
          print("month =", m)
          PY

      - name: Stop if the branch already exists
        env:
          BRANCH: routine/ig-calendar-${{ steps.month.outputs.month }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::$BRANCH は既にあります。作り直すときは古いブランチ（と PR）を閉じて消してから再実行してください。"
            exit 1
          fi

      - name: Self-test (no network)
        run: python tools/selftest_brand.py && python tools/selftest_calendar.py

      - name: Build calendar
        env:
          # カレンダー作成は Instagram に触れない。config.py の必須チェックを通すためのダミー値（本物のトークンは渡さない）
          IG_USER_ID: unused-for-calendar
          IG_ACCESS_TOKEN: unused-for-calendar
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/images
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          python src/main.py build-calendar "$MONTH"
          python src/main.py check-calendar "$MONTH"

      - name: Push branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONTH: ${{ steps.month.outputs.month }}
          BRANCH: routine/ig-calendar-${{ steps.month.outputs.month }}
        run: |
          git config user.name "coran-autopost-bot"
          git config user.email "bot@coran.local"
          git checkout -b "$BRANCH"
          # カレンダーと画像だけを入れる（selftest の残骸 images/generated/ は入れない）
          git add "calendar/${MONTH}.json" "calendar/${MONTH}.md" "calendar/${MONTH}-preview.jpg" "images/calendar/${MONTH}"
          git commit -m "chore(calendar): IG 投稿カレンダー ${MONTH}（マージ＝この月の包括承認）"
          git push origin "HEAD:refs/heads/${BRANCH}"
          BODY="IG 投稿カレンダー ${MONTH} です。

          **この PR をマージすると、下の一覧の投稿がその日に個別の承認なしで公開されます**（リポジトリ変数 CALENDAR_MODE=on のとき）。
          - 一覧と画像: https://github.com/${GITHUB_REPOSITORY}/blob/${BRANCH}/calendar/${MONTH}.md
          - 載せたくない回は calendar/${MONTH}.json からその1件を消してからマージ。本文の手直しも同じファイルで可。
          - 画像を差し替えた場合は sha256 が合わず、その月の公開が止まります（fail-closed）。作り直すときはこの PR を閉じ、ブランチを消して Run workflow。
          - この PR は自動マージされません。"
          if ! gh pr create --base main --head "$BRANCH" --title "IG 投稿カレンダー ${MONTH}（マージ＝包括承認）" --body "$BODY"; then
            echo "::warning::PR を自動で作れませんでした（Settings → Actions → General の『Allow GitHub Actions to create and approve pull requests』が無効の可能性）。次の URL から作成してください。"
            echo "https://github.com/${GITHUB_REPOSITORY}/pull/new/${BRANCH}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
